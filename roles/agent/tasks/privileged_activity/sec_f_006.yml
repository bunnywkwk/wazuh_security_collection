---
- name: "SEC-F-006 | AUDIT RULE | Record admin commands run as root"
  when: agent_admin_commands
  tags:
    - privileged_activity
    - sec_f_006
    - audit_rule
  block:
    # A watch on a missing file stops auditctl at that line, so only installed commands get one
    - name: "SEC-F-006 | AUDIT RULE | Record admin commands run as root | Find the installed commands"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ agent_admin_command_paths }}"
      register: agent_admin_command_paths_stat

    - name: "SEC-F-006 | AUDIT RULE | Record admin commands run as root | Write the audit rule"
      vars:
        agent_admin_command_paths_installed: "{{ agent_admin_command_paths_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
      ansible.builtin.template:
        src: privileged_activity/audit/sec_f_006.rules.j2
        dest: /etc/audit/rules.d/50-wazuh-sec_f_006.rules
        owner: root
        group: root
        mode: "0600"
      notify: Load audit rules
