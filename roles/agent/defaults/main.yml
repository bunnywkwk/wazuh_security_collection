---
# bunnywkwk.wazuh_security agent defaults: what the host must log for the manager rules. Override in group_vars.

## Groups
agent_privileged_activity: true

## Rules

## Group: Privileged Activity
agent_sec_f_006: true   # AUDIT RULE admin commands run as root by a logged-in user

## Settings

### SEC-F-006
agent_sec_f_006_key: audit-wazuh-c   # Wazuh's audit-keys list maps it to "command"
# Security-relevant admin commands (sheet: "set to be defined"); one audit line per installed path
agent_sec_f_006_commands:
  - /usr/sbin/useradd
  - /usr/sbin/userdel
  - /usr/sbin/usermod
  - /usr/sbin/groupadd
  - /usr/sbin/groupdel
  - /usr/sbin/groupmod
  - /usr/bin/passwd
  - /usr/bin/chage
  - /usr/sbin/visudo
  - /usr/sbin/setenforce
  - /usr/bin/firewall-cmd
  - /usr/sbin/auditctl
