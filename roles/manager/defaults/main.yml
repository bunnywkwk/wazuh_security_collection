---
# bunnywkwk.wazuh_security manager defaults. Override in group_vars.

## Groups
manager_host_access: true
manager_privileged_activity: true   # SEC-F-006 also needs the agent role

## Rules
# false = skipped (a file deployed earlier stays: delete it by hand)

## Group: Host Access (rule IDs 100110-100129)
manager_sec_f_001: true   # RECORD successful SSH login
manager_sec_f_002: true   # RECORD failed SSH login (also deployed for SEC-F-003)
manager_sec_f_003: true   # THRESHOLD brute force, SEC-TH-001 to 005
manager_sec_f_004: true   # RECORD logout
manager_sec_f_016: true   # RECORD console login; GAP: BMC access

## Group: Privileged Activity (rule IDs 100100-100109)
manager_sec_f_005: true   # RECORD sudo and su that worked
manager_sec_f_006: true   # RECORD admin commands (audit rule on the agent role)
manager_sec_f_018: true   # RECORD failed sudo and su; THRESHOLD SEC-TH-007
manager_sec_f_019: true   # ALERT direct root login, SSH and console (needs SEC-F-001 and 016)

## Settings

### SEC-F-003
manager_silence_5763: true   # built-in 5763 to level 0, it steals the 8th failure
# Account lists, read from these hosts' /etc/passwd and /etc/login.defs
manager_account_hosts: "{{ groups['wazuh_agents'] | default([]) }}"
manager_nologin_shells: [/sbin/nologin, /usr/sbin/nologin, /bin/false, /usr/bin/false]
manager_service_account_patterns: ["^svc_"]   # always service accounts

#### SEC-TH-001 service accounts
manager_th_001_warning: 3
manager_th_001_critical: 5
manager_th_001_timeframe: 600

#### SEC-TH-002 standard accounts
manager_th_002_warning: 5
manager_th_002_critical: 8
manager_th_002_timeframe: 300

#### SEC-TH-003 privileged accounts
manager_th_003_users: "^(root|frqadmin)$"
manager_th_003_warning: 3
manager_th_003_critical: 5
manager_th_003_timeframe: 300

#### SEC-TH-004 one source, any accounts
manager_th_004_warning: 10
manager_th_004_critical: 20
manager_th_004_timeframe: 300

#### SEC-TH-005 password spraying
manager_th_005_warning: 5
manager_th_005_critical: 10
manager_th_005_timeframe: 1800

### SEC-F-018
#### SEC-TH-007 failed elevation, one account
manager_th_007_warning: 3
manager_th_007_critical: 5
manager_th_007_timeframe: 600

### SEC-F-019
manager_sec_f_019_users: "^root$"
