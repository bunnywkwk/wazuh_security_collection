---
- name: "SEC-F-001 | RECORD | Record successful SSH logins"
  when: manager_sec_f_001
  tags:
    - host_access
    - sec_f_001
    - record
  ansible.builtin.template:
    src: host_access/record/sec_f_001.xml.j2
    dest: /var/ossec/etc/rules/sec_f_001.xml
    owner: wazuh
    group: wazuh
    mode: "0660"
  notify:
    - Test the manager rules
    - Restart wazuh-manager
