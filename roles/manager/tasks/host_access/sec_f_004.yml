---
- name: "SEC-F-004 | RECORD | Record SSH and console logouts"
  when: manager_sec_f_004
  tags:
    - host_access
    - sec_f_004
    - record
  ansible.builtin.template:
    src: host_access/record/sec_f_004.xml.j2
    dest: /var/ossec/etc/rules/sec_f_004.xml
    owner: wazuh
    group: wazuh
    mode: "0660"
  notify:
    - Test the manager rules
    - Restart wazuh-manager
