---
- name: "SEC-F-018 | RECORD | Record failed elevation"
  when: manager_sec_f_018
  tags:
    - privileged_activity
    - sec_f_018
    - record
  ansible.builtin.template:
    src: privileged_activity/record/sec_f_018.xml.j2
    dest: /var/ossec/etc/rules/sec_f_018.xml
    owner: wazuh
    group: wazuh
    mode: "0660"
  notify:
    - Test the manager rules
    - Restart wazuh-manager

- name: "SEC-F-018 | THRESHOLD | Alert on failed elevation | SEC-TH-007"
  when: manager_sec_f_018
  tags:
    - privileged_activity
    - sec_f_018
    - sec_th_007
    - threshold
  ansible.builtin.template:
    src: privileged_activity/threshold/sec_th_007.xml.j2
    dest: /var/ossec/etc/rules/sec_th_007.xml
    owner: wazuh
    group: wazuh
    mode: "0660"
  notify:
    - Test the manager rules
    - Restart wazuh-manager
