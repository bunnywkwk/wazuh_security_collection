---
- name: "SEC-F-019 | RECORD | Record direct root login"
  when: manager_root_login
  tags:
    - privileged_activity
    - sec_f_019
    - record
  ansible.builtin.template:
    src: privileged_activity/record/sec_f_019.xml.j2
    dest: /var/ossec/etc/rules/sec_f_019.xml
    owner: wazuh
    group: wazuh
    mode: "0660"
  notify:
    - Test the manager rules
    - Restart wazuh-manager
