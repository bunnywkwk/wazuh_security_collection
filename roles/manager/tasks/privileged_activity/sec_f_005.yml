---
- name: "SEC-F-005 | RECORD | Record sudo and su use"
  when: manager_sec_f_005
  tags:
    - privileged_activity
    - sec_f_005
    - record
  ansible.builtin.template:
    src: privileged_activity/record/sec_f_005.xml.j2
    dest: /var/ossec/etc/rules/sec_f_005.xml
    owner: wazuh
    group: wazuh
    mode: "0660"
  notify:
    - Test the manager rules
    - Restart wazuh-manager
